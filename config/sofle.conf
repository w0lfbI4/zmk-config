# Включение поддержки OLED экранов
CONFIG_ZMK_DISPLAY=y
# Включение поддержки мыши
CONFIG_ZMK_MOUSE=y


# Включение поддержки RGB подсветки (Underglow / Backlight)
CONFIG_ZMK_RGB_UNDERGLOW=y
# Разрешить питание подсветки от USB даже без батареи
CONFIG_WS2812_STRIP=y

# Включение поддержки энкодеров (крутилок), чтобы заработало вращение
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
